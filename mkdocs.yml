site_name: pylightningfx
site_url: https://ykus4.github.io/pylightningfx
site_description: Python client for bitFlyer Lightning API
repo_url: https://github.com/ykus4/pylightningfx
repo_name: ykus4/pylightningfx

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.sections

plugins:
  - search
  # The i18n plugin renders every identifier twice, once per language tree, so a
  # bare cross-reference is ambiguous. resolve_closest picks the copy in the same
  # language as the referring page.
  - autorefs:
      resolve_closest: true
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            docstring_section_style: table
            show_source: false
            members_order: source
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            heading_level: 2
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: false
            merge_init_into_class: true
            inherited_members: false
            filters: ["!^_"]
  - i18n:
      docs_structure: suffix
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: ja
          name: 日本語
          build: true

nav:
  - Home: index.md
  - API Reference:
    - Clients: api/client.md
    - Realtime: api/realtime.md
    - Models: api/models.md
    - Configuration: api/config.md
    - Errors: api/errors.md
    - Enums: api/enums.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - toc:
      permalink: true
