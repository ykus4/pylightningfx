name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # Publishing to PyPI is irreversible — a version number can never be reused —
  # so everything gets verified before the release job runs at all.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest
      - name: Check the tag matches the packaged version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          packaged=$(uv run python -c 'import pylightningfx; print(pylightningfx.__version__)')
          if [ "$tag" != "$packaged" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $packaged in pyproject.toml"
            exit 1
          fi

  release:
    needs: verify
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv build
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          # Not dist/* — uv build also leaves a dist/.gitignore behind, which the
          # action happily uploads as a 1-byte "default.gitignore" asset.
          files: |
            dist/*.whl
            dist/*.tar.gz
          generate_release_notes: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
