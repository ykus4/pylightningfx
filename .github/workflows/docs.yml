name: Deploy docs

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --group dev
      # --strict so a broken cross-reference fails the deploy instead of
      # silently publishing a page with a dangling link.
      - run: uv run mkdocs gh-deploy --force --strict
