[project]
name = "pylightningfx"
version = "0.2.0"
description = "Python client for bitFlyer Lightning API"
authors = [
    { name = "ykus4", email = "a2gwhitex@icloud.com" }
]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
keywords = ["bitflyer", "bitcoin", "crypto", "trading", "api"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "websockets>=15.0",
]

[project.urls]
Homepage = "https://github.com/ykus4/pylightningfx"
Documentation = "https://ykus4.github.io/pylightningfx"
Repository = "https://github.com/ykus4/pylightningfx"
"Bug Tracker" = "https://github.com/ykus4/pylightningfx/issues"

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.6",
    "mkdocs-static-i18n>=1.3.1",
    "mkdocstrings[python]>=0.27",
    "mypy>=1.14",
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "ruff>=0.15.14",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--strict-markers --strict-config"

[tool.mypy]
python_version = "3.13"
files = ["src", "tests"]
strict = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[[tool.mypy.overrides]]
# Tests assert on loosely typed JSON fixtures; strictness there costs more than it catches.
module = "tests.*"
disallow_untyped_defs = false
disallow_any_expr = false

[tool.coverage.run]
source = ["src/pylightningfx"]
branch = true

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise AssertionError", "@overload"]
